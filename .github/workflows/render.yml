name: Prompt Studio FFmpeg Renderer
on:
  workflow_dispatch:
    inputs:
      job_id: { description: 'Prompt Studio render job', required: true, type: string }
      api_base: { description: 'Prompt Studio API origin', required: true, type: string }
permissions:
  contents: read
  id-token: write
concurrency:
  group: prompt-studio-render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and upload
        env:
          JOB_ID: ${{ inputs.job_id }}
          API_BASE: ${{ inputs.api_base }}
        run: python worker/render.py
